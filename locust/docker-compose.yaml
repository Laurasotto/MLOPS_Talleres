version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Taller Locust
# Este compose levanta la API de inferencia usando la imagen publicada en
# DockerHub. Se conecta al MLflow y MinIO del taller anterior.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── API de inferencia (imagen publicada en DockerHub) ────────────────────
  inference-api:
    image: thomasriverafonseca/mlflow-api:latest
    container_name: locust_inference_api
    entrypoint: ["bash", "-c"]
    command: >
      "pip install fastapi uvicorn mlflow==2.3.0 boto3 --quiet &&
       uvicorn api:app --host 0.0.0.0 --port 8000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://host.docker.internal:9002
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: supersecret
      MLFLOW_TRACKING_URI: http://host.docker.internal:5001
    ports:
      - "8001:8000"     # puerto 8001 para no chocar con el del taller anterior
    deploy:
      resources:
        limits:
          cpus: "0.5"   # límite de CPU — ajustar según pruebas de carga
          memory: 512M  # límite de memoria — ajustar según pruebas de carga
    restart: unless-stopped
