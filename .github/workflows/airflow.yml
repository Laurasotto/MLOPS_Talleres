# Construye y sube la imagen personalizada de Airflow a DockerHub.
# Se activa solo cuando cambia algo dentro de tercer_proyecto/airflow/,
# por ejemplo si se modifica el DAG, los requirements o el Dockerfile.

name: Build y Push Airflow

on:
  push:
    branches:
      - main
    paths:
      - "tercer_proyecto/airflow/**"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Login a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push
        uses: docker/build-push-action@v5
        with:
          context: tercer_proyecto/airflow
          push: true
          platforms: linux/amd64,linux/arm64
          tags: thomasriverafonseca/p3-airflow:latest
