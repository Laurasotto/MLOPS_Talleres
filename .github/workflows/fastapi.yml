# Construye y sube la imagen de la API de inferencia a DockerHub.
# Se activa solo cuando cambia algo dentro de tercer_proyecto/fastapi/,
# así no reconstruimos todas las imágenes por un cambio en otro componente.

name: Build y Push API de Inferencia

on:
  push:
    branches:
      - main
    paths:
      - "tercer_proyecto/fastapi/**"
  # Permite correr el workflow manualmente desde la UI de GitHub
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Descarga el código del repo para que los pasos siguientes puedan usarlo
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Hace login a DockerHub usando las credenciales guardadas como secretos en GitHub.
      # DOCKERHUB_USERNAME y DOCKERHUB_TOKEN se configuran en Settings > Secrets del repo.
      - name: Login a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Habilita BuildKit, que es el motor de build moderno de Docker.
      # Permite builds multi-plataforma y es más rápido que el builder clásico.
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Construye la imagen desde tercer_proyecto/fastapi/ y la sube a DockerHub.
      # context indica dónde está el Dockerfile y los archivos que necesita.
      - name: Build y Push
        uses: docker/build-push-action@v5
        with:
          context: tercer_proyecto/fastapi
          push: true
          tags: thomasriverafonseca/p3-inference:latest
