# Construye y sube la imagen de Streamlit a DockerHub.
# Se activa solo cuando cambia algo dentro de tercer_proyecto/streamlit/,
# por ejemplo si se modifica el dashboard, los requirements o la imagen de la casa.

name: Build y Push Streamlit

on:
  push:
    branches:
      - main
    paths:
      - "tercer_proyecto/streamlit/**"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Login a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push
        uses: docker/build-push-action@v5
        with:
          context: tercer_proyecto/streamlit
          push: true
          platforms: linux/amd64,linux/arm64
          tags: thomasriverafonseca/p3-streamlit:latest
