# Construye y sube la imagen del servidor de MLflow a DockerHub.
# Se activa solo cuando cambia algo dentro de tercer_proyecto/mlflow/,
# por ejemplo si se actualiza la versión de MLflow o el Dockerfile.

name: Build y Push MLflow

on:
  push:
    branches:
      - main
    paths:
      - "tercer_proyecto/mlflow/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Login a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push
        uses: docker/build-push-action@v5
        with:
          context: tercer_proyecto/mlflow
          push: true
          tags: thomasriverafonseca/p3-mlflow:latest
