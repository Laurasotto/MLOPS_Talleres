services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    ports:
      - "8888:8888"
    volumes:
      - shared_models:/shared
    environment:
      - MODEL_DIR=/shared/model
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8989:8989"
    volumes:
      - shared_models:/shared
    environment:
      - MODEL_DIR=/shared/model

volumes:
  shared_models:
