apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: mlflow
spec:
  type: ClusterIP
  selector:
    app: mlflow
  ports:
    - name: api
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-ui
  namespace: mlflow
spec:
  type: NodePort
  selector:
    app: mlflow
  ports:
    - name: ui
      port: 5000
      targetPort: 5000
      nodePort: 30501
