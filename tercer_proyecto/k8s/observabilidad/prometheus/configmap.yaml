apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observabilidad
data:
  prometheus.yml: |
    global:
      # Cada 5 segundos Prometheus le pregunta a cada target por sus métricas
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'inference-api'
        static_configs:
          # Apunta al endpoint /metrics de la API de inferencia dentro del cluster.
          # Prometheus llega ahí porque ambos están en K8s y pueden verse por DNS interno.
          - targets: ['inference-service.inference.svc.cluster.local:8000']
