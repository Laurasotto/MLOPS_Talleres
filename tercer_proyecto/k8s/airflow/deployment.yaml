apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      initContainers:
        # Inicializa la BD de Airflow y crea el usuario admin antes de arrancar
        - name: airflow-init
          image: thomasriverafonseca/p3-airflow:latest
          command:
            - bash
            - -c
            - |
              airflow db migrate &&
              airflow users create \
                --username admin \
                --password admin123 \
                --firstname Admin \
                --lastname Admin \
                --role Admin \
                --email admin@grupo4.com || true
          envFrom:
            - secretRef:
                name: airflow-secret
            - configMapRef:
                name: airflow-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          volumeMounts:
            - name: logs
              mountPath: /opt/airflow/logs
      containers:
        - name: scheduler
          image: thomasriverafonseca/p3-airflow:latest
          command: ["airflow", "scheduler"]
          envFrom:
            - secretRef:
                name: airflow-secret
            - configMapRef:
                name: airflow-config
          volumeMounts:
            - name: logs
              mountPath: /opt/airflow/logs
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["airflow", "jobs", "check", "--job-type", "SchedulerJob"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-logs-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      containers:
        - name: webserver
          image: thomasriverafonseca/p3-airflow:latest
          command: ["airflow", "webserver"]
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: airflow-secret
            - configMapRef:
                name: airflow-config
          volumeMounts:
            - name: logs
              mountPath: /opt/airflow/logs
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-logs-pvc
