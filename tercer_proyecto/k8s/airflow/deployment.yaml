apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      initContainers:
        # Inicializa la BD de Airflow y crea el usuario admin antes de arrancar
        - name: airflow-init
          image: thomasriverafonseca/p3-airflow:latest
          imagePullPolicy: Never
          command:
            - bash
            - -c
            - |
              airflow db migrate &&
              airflow users create \
                --username admin \
                --password admin123 \
                --firstname Admin \
                --lastname Admin \
                --role Admin \
                --email admin@grupo4.com || true &&
              airflow connections add postgres_mlops \
                --conn-type postgres \
                --conn-host postgres-service.postgres.svc.cluster.local \
                --conn-schema mlops \
                --conn-login grupo4 \
                --conn-password grupo4pass \
                --conn-port 5432 || true &&
              airflow connections add minio_s3 \
                --conn-type aws \
                --conn-extra '{"endpoint_url":"http://minio-service.minio.svc.cluster.local:9000","aws_access_key_id":"minioadmin","aws_secret_access_key":"minioadmin123","region_name":"us-east-1"}' || true
          envFrom:
            - secretRef:
                name: airflow-secret
            - configMapRef:
                name: airflow-config
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: logs
              mountPath: /opt/airflow/logs
      containers:
        - name: scheduler
          image: thomasriverafonseca/p3-airflow:latest
          imagePullPolicy: Never
          command: ["airflow", "scheduler"]
          envFrom:
            - secretRef:
                name: airflow-secret
            - configMapRef:
                name: airflow-config
          volumeMounts:
            - name: logs
              mountPath: /opt/airflow/logs
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "4Gi"
          livenessProbe:
            exec:
              command: ["airflow", "jobs", "check", "--job-type", "SchedulerJob"]
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 5
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-logs-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      containers:
        - name: webserver
          image: thomasriverafonseca/p3-airflow:latest
          imagePullPolicy: Never
          command: ["airflow", "webserver"]
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: airflow-secret
            - configMapRef:
                name: airflow-config
          volumeMounts:
            - name: logs
              mountPath: /opt/airflow/logs
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 5
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-logs-pvc
