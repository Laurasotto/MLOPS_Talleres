apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p3-observabilidad
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Laurasotto/MLOPS_Talleres.git
    targetRevision: main
    path: tercer_proyecto/k8s/observabilidad
    directory:
      # recurse: true hace que Argo CD entre en las subcarpetas prometheus/ y grafana/
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidad
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
