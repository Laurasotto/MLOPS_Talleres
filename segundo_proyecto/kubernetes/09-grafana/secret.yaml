# Credenciales del administrador de Grafana codificadas en base64.
# Para decodificar: echo "YWRtaW4=" | base64 -d  → admin
#
# Valores actuales:
#   GF_SECURITY_ADMIN_USER:     YWRtaW4=       → admin
#   GF_SECURITY_ADMIN_PASSWORD: YWRtaW4xMjM=   → admin123
#
# Acceso a la UI: http://localhost:30300 (credenciales: admin / admin123)
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: mlops-p2
type: Opaque
data:
  GF_SECURITY_ADMIN_USER: YWRtaW4=
  GF_SECURITY_ADMIN_PASSWORD: YWRtaW4xMjM=
