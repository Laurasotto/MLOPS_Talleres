# Dos Services para Grafana:
# - ClusterIP: comunicación interna
# - NodePort 30300: acceso a los dashboards desde el navegador → http://localhost:30300
#   Credenciales: admin / admin123

# Service interno
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: mlops-p2
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
# Service externo — para ver los dashboards desde el navegador
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: mlops-p2
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300  # → http://localhost:30300 (admin / admin123)
  type: NodePort
