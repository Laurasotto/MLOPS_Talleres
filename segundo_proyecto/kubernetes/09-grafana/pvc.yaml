# Volumen persistente para Grafana — sin esto los dashboards que creemos
# y la configuración se pierden al reiniciar el pod.
# 1Gi es más que suficiente para los dashboards del proyecto.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: mlops-p2
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
