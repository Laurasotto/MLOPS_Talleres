apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops-p2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres-service 5432; do echo waiting for postgres; sleep 3; done
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z minio-service 9000; do echo waiting for minio; sleep 3; done
        - name: create-minio-bucket
          image: minio/mc:latest
          command:
            - sh
            - -c
            - |
              mc alias set myminio http://minio-service:9000 minioadmin minioadmin123 &&
              mc mb --ignore-existing myminio/mlflows3
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.14.1
          command:
            - sh
            - -c
            - |
              pip install psycopg2-binary boto3 &&
              mlflow server \
                --backend-store-uri $(MLFLOW_BACKEND_STORE_URI) \
                --artifacts-destination $(MLFLOW_ARTIFACT_ROOT) \
                --serve-artifacts \
                --host 0.0.0.0 \
                --port 5000
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: mlflow-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
