# MLflow tiene dos Services:
# - ClusterIP: para que Airflow y la API se comuniquen con MLflow dentro del cluster
# - NodePort: para que podamos abrir la UI de MLflow en el navegador desde nuestra máquina

# Service interno — Airflow y la API usan "http://mlflow-service:5000" para registrar modelos
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: mlops-p2
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
---
# Service externo — accesible en http://localhost:30500 desde fuera del cluster
apiVersion: v1
kind: Service
metadata:
  name: mlflow-nodeport
  namespace: mlops-p2
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500  # puerto del nodo accesible desde el host
  type: NodePort
