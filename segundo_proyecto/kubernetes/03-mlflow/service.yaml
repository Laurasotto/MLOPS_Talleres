apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: mlops-p2
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-nodeport
  namespace: mlops-p2
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
  type: NodePort
