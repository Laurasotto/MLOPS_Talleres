# Deployment de la interfaz web Streamlit — es la UI que usan los usuarios para hacer predicciones.
# Solo necesita 1 réplica porque no es crítica para el servicio de inferencia.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  namespace: mlops-p2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit
  template:
    metadata:
      labels:
        app: streamlit
    spec:
      containers:
        - name: streamlit
          image: thomasriverafonseca/diabetes-streamlit:latest
          ports:
            - containerPort: 8501  # puerto por defecto de Streamlit
          envFrom:
            - configMapRef:
                name: streamlit-config
          # Streamlit consume muy pocos recursos comparado con la API o el scheduler
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Streamlit tiene su propio endpoint de salud en /_stcore/health
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 15
