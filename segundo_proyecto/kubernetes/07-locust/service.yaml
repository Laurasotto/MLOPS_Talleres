apiVersion: v1
kind: Service
metadata:
  name: locust-service
  namespace: mlops-p2
spec:
  selector:
    app: locust
  ports:
    - port: 8089
      targetPort: 8089
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: locust-nodeport
  namespace: mlops-p2
spec:
  selector:
    app: locust
  ports:
    - port: 8089
      targetPort: 8089
      nodePort: 30889
  type: NodePort
