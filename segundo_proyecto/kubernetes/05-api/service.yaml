apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: mlops-p2
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: api-nodeport
  namespace: mlops-p2
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
  type: NodePort
