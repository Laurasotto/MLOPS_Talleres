# Deployment de la API de inferencia.
# Usamos 2 réplicas para tener alta disponibilidad y distribuir la carga entre dos pods.
# Si un pod falla, el otro sigue respondiendo sin interrupción del servicio.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mlops-p2
spec:
  replicas: 2  # dos instancias de la API corriendo en paralelo
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      # Estas anotaciones le dicen a Prometheus cómo encontrar y scrapear este pod.
      # El job "kubernetes-pods" del configmap de Prometheus busca pods con scrape=true
      # y usa path y port para saber a dónde ir a buscar las métricas.
      annotations:
        prometheus.io/scrape: "true"      # Prometheus debe scrapear este pod
        prometheus.io/path: "/metrics"    # endpoint donde están las métricas
        prometheus.io/port: "8000"        # puerto del contenedor
    spec:
      initContainers:
        # Esperamos a postgres antes de arrancar — la API necesita guardar logs de inferencia
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres-service 5432; do echo waiting for postgres; sleep 3; done

        # Esperamos a MLflow antes de arrancar — la API carga el modelo desde MLflow al inicio
        - name: wait-for-mlflow
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mlflow-service 5000; do echo waiting for mlflow; sleep 3; done

      containers:
        - name: api
          image: thomasriverafonseca/diabetes-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-config
          resources:
            requests:
              cpu: 200m      # menos CPU que postgres/mlflow porque la inferencia es rápida
              memory: 512Mi  # el modelo Random Forest ocupa RAM al cargarse
            limits:
              cpu: "1"
              memory: 1Gi
          # readinessProbe: Kubernetes no envía tráfico hasta que /health responde OK.
          # Esto evita que el load balancer mande requests a un pod que todavía está cargando el modelo.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15  # tiempo para descargar y cargar el modelo desde MLflow
            periodSeconds: 5
            failureThreshold: 5
          # livenessProbe: si /health deja de responder, Kubernetes reinicia el pod
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
