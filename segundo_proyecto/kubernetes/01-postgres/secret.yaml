# Un Secret guarda información sensible como contraseñas.
# Los valores están en base64 — esto NO es encriptación, solo es una codificación.
# Kubernetes los trata diferente a los ConfigMaps (no los loguea, los monta en memoria, etc.)
#
# Para decodificar un valor: echo "cG9zdGdyZXM=" | base64 -d  → postgres
# Para codificar uno nuevo: echo -n "mipassword" | base64
#
# Valores actuales (base64 → texto):
#   POSTGRES_USER:     cG9zdGdyZXM=       → postgres
#   POSTGRES_PASSWORD: cG9zdGdyZXMxMjM=   → postgres123
#   POSTGRES_DB:       bWxvcHNfZGI=        → mlops_db
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: mlops-p2
type: Opaque
data:
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXMxMjM=
  POSTGRES_DB: bWxvcHNfZGI=
