# Este ConfigMap contiene el script SQL que PostgreSQL ejecuta automáticamente
# la primera vez que arranca (porque lo montamos en /docker-entrypoint-initdb.d/).
# Aquí creamos todos los schemas y tablas que necesita el pipeline antes de que
# Airflow o la API intenten escribir en ellos.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: mlops-p2
data:
  init.sql: |
    -- Airflow necesita su propia base de datos para guardar metadatos de DAGs, runs y tareas.
    -- La creamos solo si no existe para que el script sea seguro de ejecutar varias veces.
    SELECT 'CREATE DATABASE airflow_db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'airflow_db')\gexec

    -- Creamos los schemas que separan los datos por etapa del pipeline
    CREATE SCHEMA IF NOT EXISTS raw_data;       -- datos crudos tal como vienen del CSV
    CREATE SCHEMA IF NOT EXISTS clean_data;     -- datos procesados listos para entrenar
    CREATE SCHEMA IF NOT EXISTS inference_logs; -- registro de cada predicción que hace la API

    -- Tabla que lleva el control de qué batches ya se cargaron y hasta qué fila llegamos.
    -- Esto permite que el pipeline pause y continúe sin volver a cargar datos desde el inicio.
    CREATE TABLE IF NOT EXISTS raw_data.batch_state (
        id            SERIAL PRIMARY KEY,
        batch_id      INT UNIQUE NOT NULL,
        last_row_loaded INT NOT NULL DEFAULT 0,
        total_rows    INT,
        status        VARCHAR(20) DEFAULT 'in_progress',
        created_at    TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at    TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Tabla de datos crudos — guardamos todo tal como viene del CSV sin modificar nada.
    -- row_hash es un MD5 de cada fila que usamos para evitar duplicados en recargas.
    CREATE TABLE IF NOT EXISTS raw_data.diabetes_raw (
        id                          SERIAL PRIMARY KEY,
        batch_id                    INT NOT NULL,
        load_timestamp              TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        source_file                 VARCHAR(255),
        row_hash                    VARCHAR(64) UNIQUE,
        status                      VARCHAR(20) DEFAULT 'loaded',
        race                        TEXT,
        gender                      TEXT,
        age                         TEXT,
        weight                      TEXT,
        admission_type_id           TEXT,
        discharge_disposition_id    TEXT,
        admission_source_id         TEXT,
        time_in_hospital            TEXT,
        payer_code                  TEXT,
        medical_specialty           TEXT,
        num_lab_procedures          TEXT,
        num_procedures              TEXT,
        num_medications             TEXT,
        number_outpatient           TEXT,
        number_emergency            TEXT,
        number_inpatient            TEXT,
        diag_1                      TEXT,
        diag_2                      TEXT,
        diag_3                      TEXT,
        number_diagnoses            TEXT,
        max_glu_serum               TEXT,
        a1cresult                   TEXT,
        metformin                   TEXT,
        repaglinide                 TEXT,
        nateglinide                 TEXT,
        chlorpropamide              TEXT,
        glimepiride                 TEXT,
        acetohexamide               TEXT,
        glipizide                   TEXT,
        glyburide                   TEXT,
        tolbutamide                 TEXT,
        pioglitazone                TEXT,
        rosiglitazone               TEXT,
        acarbose                    TEXT,
        miglitol                    TEXT,
        troglitazone                TEXT,
        tolazamide                  TEXT,
        examide                     TEXT,
        citoglipton                 TEXT,
        insulin                     TEXT,
        glyburide_metformin         TEXT,
        glipizide_metformin         TEXT,
        glimepiride_pioglitazone    TEXT,
        metformin_rosiglitazone     TEXT,
        metformin_pioglitazone      TEXT,
        change_col                  TEXT,
        diabetesmed                 TEXT,
        readmitted                  TEXT,
        created_at                  TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Índice sobre batch_id para que las consultas por batch sean rápidas
    CREATE INDEX IF NOT EXISTS idx_raw_batch_id ON raw_data.diabetes_raw(batch_id);

    -- Tabla de datos limpios — aquí guardamos los datos ya codificados como FLOAT,
    -- listos para entrenar el modelo. Cada columna corresponde a una feature del modelo.
    CREATE TABLE IF NOT EXISTS clean_data.diabetes_clean (
        id                               SERIAL PRIMARY KEY,
        batch_id                         INT NOT NULL,
        raw_id                           INT,
        time_in_hospital                 FLOAT,
        num_lab_procedures               FLOAT,
        num_procedures                   FLOAT,
        num_medications                  FLOAT,
        number_outpatient                FLOAT,
        number_emergency                 FLOAT,
        number_inpatient                 FLOAT,
        number_diagnoses                 FLOAT,
        age_encoded                      FLOAT,
        gender_encoded                   FLOAT,
        race_encoded                     FLOAT,
        admission_type_id                FLOAT,
        discharge_disposition_id         FLOAT,
        admission_source_id              FLOAT,
        a1cresult_encoded                FLOAT,
        max_glu_serum_encoded            FLOAT,
        metformin_encoded                FLOAT,
        repaglinide_encoded              FLOAT,
        nateglinide_encoded              FLOAT,
        chlorpropamide_encoded           FLOAT,
        glimepiride_encoded              FLOAT,
        acetohexamide_encoded            FLOAT,
        glipizide_encoded                FLOAT,
        glyburide_encoded                FLOAT,
        tolbutamide_encoded              FLOAT,
        pioglitazone_encoded             FLOAT,
        rosiglitazone_encoded            FLOAT,
        acarbose_encoded                 FLOAT,
        miglitol_encoded                 FLOAT,
        troglitazone_encoded             FLOAT,
        tolazamide_encoded               FLOAT,
        examide_encoded                  FLOAT,
        citoglipton_encoded              FLOAT,
        insulin_encoded                  FLOAT,
        glyburide_metformin_encoded      FLOAT,
        glipizide_metformin_encoded      FLOAT,
        glimepiride_pioglitazone_encoded FLOAT,
        metformin_rosiglitazone_encoded  FLOAT,
        metformin_pioglitazone_encoded   FLOAT,
        change_encoded                   FLOAT,
        diabetesmed_encoded              FLOAT,
        diag_1_code                      FLOAT,
        diag_2_code                      FLOAT,
        diag_3_code                      FLOAT,
        readmitted_binary                INT NOT NULL,
        created_at                       TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_clean_batch_id ON clean_data.diabetes_clean(batch_id);

    -- pgcrypto nos da la función gen_random_uuid() que usamos en inference_logs
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";

    -- Tabla donde la API guarda cada predicción que realiza.
    -- Esto nos permite auditar qué predijo el modelo y cuándo.
    CREATE TABLE IF NOT EXISTS inference_logs.predictions (
        id                  SERIAL PRIMARY KEY,
        request_id          UUID DEFAULT gen_random_uuid(),
        inference_timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        input_data          JSONB,           -- los datos del paciente que se enviaron
        prediction          INT,             -- 0 o 1
        prediction_label    VARCHAR(50),     -- etiqueta legible del resultado
        probability         FLOAT,           -- confianza del modelo en la predicción
        model_name          VARCHAR(255),
        model_version       VARCHAR(50),
        model_alias         VARCHAR(50),
        response_time_ms    FLOAT,
        created_at          TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
