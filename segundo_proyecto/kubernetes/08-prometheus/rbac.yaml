apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: mlops-p2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-mlops-p2
rules:
  - apiGroups: [""]
    # nodes/proxy es necesario para que Prometheus pueda acceder a cadvisor via la API de Kubernetes
    # sin este permiso el scrape de kubernetes-cadvisor devuelve 403 Forbidden
    resources: ["nodes", "nodes/metrics", "nodes/proxy", "pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-mlops-p2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-mlops-p2
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: mlops-p2
