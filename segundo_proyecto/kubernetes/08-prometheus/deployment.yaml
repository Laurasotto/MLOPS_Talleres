# Deployment de Prometheus — el servidor que recolecta y almacena todas las métricas.
# Necesita una ServiceAccount con permisos especiales para descubrir pods y nodos (ver rbac.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mlops-p2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # Usamos la ServiceAccount "prometheus" que tiene los permisos definidos en rbac.yaml.
      # Sin esto, Prometheus no puede descubrir pods ni acceder a cAdvisor.
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml  # archivo de configuración que montamos desde el ConfigMap
            - --storage.tsdb.path=/prometheus               # directorio donde guarda las métricas (el PVC)
            - --web.console.libraries=/etc/prometheus/console_libraries
            - --web.console.templates=/etc/prometheus/consoles
            - --web.enable-lifecycle  # habilita el endpoint /-/reload para recargar config sin reiniciar
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus        # aquí montamos el prometheus.yml del ConfigMap
            - name: prometheus-data
              mountPath: /prometheus            # aquí Prometheus guarda sus datos de series temporales
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Prometheus tiene endpoints específicos para readiness y liveness
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config  # el prometheus.yml que definimos en configmap.yaml
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-pvc  # el volumen donde se guardan las métricas históricas
