# Claves secretas de Airflow codificadas en base64.
#
# FERNET_KEY: clave de encriptación que Airflow usa para guardar conexiones de forma segura
#             en la base de datos. Si cambia, las conexiones guardadas quedan inválidas.
# SECRET_KEY: clave para firmar las sesiones de la interfaz web (como las cookies de login).
#
# Credenciales de acceso a la UI: airflow / airflow (definidas en el initContainer del deployment)
apiVersion: v1
kind: Secret
metadata:
  name: airflow-secret
  namespace: mlops-p2
type: Opaque
data:
  # airflow / airflow123
  AIRFLOW__CORE__FERNET_KEY: WlgyYTNiS3g4NHVrR1pMSmxwQU4xUzRCdkJieXd3S09nZ2pkQ3dVMnpGRT0=
  AIRFLOW__WEBSERVER__SECRET_KEY: bWxvcHNwcm95ZWN0bzJzZWNyZXQ=
