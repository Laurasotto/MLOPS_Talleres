# Airflow necesita dos procesos separados que corren en pods distintos:
# 1) Webserver: la interfaz web para ver y disparar DAGs
# 2) Scheduler: el proceso que decide cuándo ejecutar cada tarea
# Ambos comparten los mismos volúmenes de DAGs, logs y datos.

# ─── WEBSERVER ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: mlops-p2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      initContainers:
        # 1) Esperamos a que postgres esté listo — Airflow no puede arrancar sin él
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres-service 5432; do echo waiting for postgres; sleep 3; done

        # 2) Inicializamos la base de datos de Airflow y creamos el usuario admin.
        #    "|| true" al final evita error si el usuario ya existe (reinicios del pod).
        - name: airflow-init
          image: thomasriverafonseca/diabetes-airflow:latest
          command:
            - sh
            - -c
            - |
              airflow db init &&
              airflow users create \
                --username airflow \
                --password airflow \
                --firstname Admin \
                --lastname User \
                --role Admin \
                --email admin@mlops.local || true
          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: airflow-secret
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
            - name: logs
              mountPath: /opt/airflow/logs
            - name: data
              mountPath: /opt/airflow/data

      containers:
        - name: webserver
          image: thomasriverafonseca/diabetes-airflow:latest
          command: ["airflow", "webserver"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: airflow-secret
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags   # aquí están los archivos .py de nuestros DAGs
            - name: logs
              mountPath: /opt/airflow/logs   # logs de cada tarea ejecutada
            - name: data
              mountPath: /opt/airflow/data   # el CSV de diabetes montado aquí
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
      volumes:
        - name: dags
          persistentVolumeClaim:
            claimName: airflow-dags-pvc
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-logs-pvc
        - name: data
          persistentVolumeClaim:
            claimName: airflow-data-pvc
---
# ─── SCHEDULER ───────────────────────────────────────────────────────────────
# El scheduler no tiene interfaz web — solo monitorea los DAGs y dispara tareas.
# Necesita más RAM que el webserver porque corre las tareas del pipeline directamente
# (con LocalExecutor, el scheduler también ejecuta las tareas, no solo las programa).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: mlops-p2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      initContainers:
        # Esperamos a postgres antes de arrancar el scheduler
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres-service 5432; do echo waiting for postgres; sleep 5; done
      containers:
        - name: scheduler
          image: thomasriverafonseca/diabetes-airflow:latest
          command: ["airflow", "scheduler"]
          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: airflow-secret
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
            - name: logs
              mountPath: /opt/airflow/logs
            - name: data
              mountPath: /opt/airflow/data
          # El scheduler necesita más memoria porque con LocalExecutor también corre las tareas.
          # Los DAGs del pipeline cargan pandas DataFrames grandes y entrenan modelos en memoria.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 3Gi
          # El scheduler no tiene endpoint HTTP, así que usamos un comando interno de Airflow
          # para verificar que el proceso de scheduling sigue activo.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - airflow jobs check --job-type SchedulerJob --hostname "$(hostname)"
            initialDelaySeconds: 120  # el scheduler tarda más en estar completamente operativo
            periodSeconds: 60
            failureThreshold: 10
            timeoutSeconds: 30
      volumes:
        - name: dags
          persistentVolumeClaim:
            claimName: airflow-dags-pvc
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-logs-pvc
        - name: data
          persistentVolumeClaim:
            claimName: airflow-data-pvc
