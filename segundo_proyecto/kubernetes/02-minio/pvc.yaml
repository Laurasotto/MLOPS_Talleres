# Volumen persistente para MinIO — sin esto los modelos y artefactos se pierden al reiniciar el pod.
# 5Gi es suficiente para los modelos Random Forest y sus artefactos de evaluación.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: mlops-p2
spec:
  accessModes:
    - ReadWriteOnce  # un solo pod monta el volumen — suficiente para una instancia de MinIO
  resources:
    requests:
      storage: 5Gi
