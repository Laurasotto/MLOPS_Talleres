# Credenciales de MinIO codificadas en base64.
# Para decodificar: echo "bWluaW9hZG1pbg==" | base64 -d  → minioadmin
#
# Valores actuales:
#   MINIO_ROOT_USER:     bWluaW9hZG1pbg==       → minioadmin
#   MINIO_ROOT_PASSWORD: bWluaW9hZG1pbjEyMw==   → minioadmin123
#
# Estos mismos valores se configuran en el ConfigMap de MLflow y Airflow
# para que puedan conectarse a MinIO como si fuera AWS S3.
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: mlops-p2
type: Opaque
data:
  MINIO_ROOT_USER: bWluaW9hZG1pbg==
  MINIO_ROOT_PASSWORD: bWluaW9hZG1pbjEyMw==
