# Usamos StatefulSet para MinIO por la misma razón que para postgres:
# necesita una identidad estable y el mismo volumen persistente al reiniciarse.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: mlops-p2
spec:
  serviceName: minio-service
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-06-13T22-53-53Z  # versión fija para reproducibilidad
          # Arrancamos MinIO en modo servidor apuntando a /data (el volumen montado)
          # y definimos en qué puerto expone la consola web
          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
              name: api      # API compatible con S3
            - containerPort: 9001
              name: console  # consola web de administración
          envFrom:
            - secretRef:
                name: minio-secret  # usuario y contraseña de root
          volumeMounts:
            - name: minio-data
              mountPath: /data  # aquí MinIO guarda todos los buckets y objetos
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # MinIO expone un endpoint de salud en /minio/health/live que usamos para ambas probes
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc  # el volumen de 5Gi definido en pvc.yaml
