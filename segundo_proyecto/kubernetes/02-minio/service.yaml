apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: mlops-p2
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: minio-console-service
  namespace: mlops-p2
spec:
  selector:
    app: minio
  ports:
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
  type: NodePort
